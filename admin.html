<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novad — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#141210;--paper:#f7f3ec;--paper2:#efe8dc;--line:#d8cebd;--muted:#5c554a;--accent:#1f4d3a;--accent2:#c56a2e;--card:#fffdf8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px}
  h1,h2{font-family:'Fraunces',serif;font-weight:600}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:40px;max-width:380px;width:100%}
  .login-box h1{font-size:28px;margin-bottom:6px}
  .login-box p{color:var(--muted);font-size:14px;margin-bottom:24px}
  .login-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:14px}
  .login-box input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:15px;background:#fff}
  .login-box input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .login-box button{width:100%;margin-top:22px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:14px;font-family:'Inter';font-weight:600;font-size:15px;cursor:pointer}
  .login-box button:hover{background:#163a2b}
  .login-err{color:#b6533a;font-size:13px;margin-top:12px;min-height:16px}
  /* app */
  .app{display:none}
  .app.on{display:block}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .brand span{color:var(--accent)}
  .hactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font-family:'Inter';font-weight:600;font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:6px;cursor:pointer;transition:all .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .btn.solid:hover{opacity:.9;color:#fff}
  .wrap{padding:24px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px;min-width:130px}
  .stat b{font-family:'Fraunces',serif;font-size:30px;font-weight:600;display:block;line-height:1;color:var(--accent)}
  .stat span{font-size:12.5px;color:var(--muted)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filters input,.filters select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff}
  .filters input{flex:1;min-width:200px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  th{background:var(--paper2);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0}
  th:hover{color:var(--accent)}
  td.msg{white-space:normal;max-width:280px;min-width:200px}
  tr:hover td{background:rgba(31,77,58,.03)}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .badge.c{background:rgba(31,77,58,.12);color:var(--accent)}
  .badge.i{background:var(--paper2);color:var(--muted)}
  .empty{padding:50px;text-align:center;color:var(--muted)}
  .count{font-size:13px;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="login-box">
    <h1>Novad <span style="color:var(--accent)">·</span> Admin</h1>
    <p>Accès réservé. Connectez-vous pour consulter les inscrits.</p>
    <label for="mail">Email</label>
    <input id="mail" type="email" autocomplete="username">
    <label for="pass">Mot de passe</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button onclick="login()">Se connecter</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appView">
  <header>
    <div class="brand">Novad <span>·</span> Admin</div>
    <div class="hactions">
      <button class="btn" onclick="loadLeads()">↻ Rafraîchir</button>
      <button class="btn solid" onclick="exportCSV()">Exporter CSV</button>
      <button class="btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <input id="search" placeholder="Rechercher (nom, email, téléphone…)" oninput="render()">
      <select id="fStatut" onchange="render()"><option value="">Tous statuts</option><option>Complété</option><option>Inscrit</option></select>
      <select id="fApport" onchange="render()"><option value="">Tous apports</option></select>
      <select id="fRegion" onchange="render()"><option value="">Toutes régions</option></select>
      <select id="fHorizon" onchange="render()"><option value="">Tous horizons</option></select>
    </div>

    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Aucun lead pour ces critères.</div>
    </div>
  </div>
</div>

<script>
  var SB_URL='https://odqssmvlrgzpxvaulpze.supabase.co';
  var SB_KEY='sb_publishable_9R0DQElFUNEHErLDy173vQ_3r1akzbZ';
  var sb=supabase.createClient(SB_URL,SB_KEY);

  var COLS=[
    {k:'created_at',label:'Date'},{k:'statut',label:'Statut'},{k:'prenom',label:'Prénom'},{k:'nom',label:'Nom'},
    {k:'email',label:'Email'},{k:'tel',label:'Téléphone'},{k:'horizon',label:'Horizon'},{k:'apport',label:'Apport'},
    {k:'secteurs',label:'Secteurs'},{k:'region',label:'Région'},{k:'situation',label:'Situation'},
    {k:'attentes',label:'Attentes'},{k:'message',label:'Message'}
  ];
  var LEADS=[], sortKey='created_at', sortAsc=false;

  // -- session au chargement --
  sb.auth.getSession().then(function(r){ if(r.data.session){ showApp(); } });

  function login(){
    var email=document.getElementById('mail').value.trim();
    var pass=document.getElementById('pass').value;
    document.getElementById('loginErr').textContent='';
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      if(r.error){document.getElementById('loginErr').textContent='Connexion refusée : '+r.error.message;return;}
      showApp();
    });
  }
  function logout(){ sb.auth.signOut().then(function(){ location.reload(); }); }

  function showApp(){
    document.getElementById('loginView').style.display='none';
    document.getElementById('appView').classList.add('on');
    loadLeads();
  }

  function loadLeads(){
    sb.from('leads').select('*').order('created_at',{ascending:false}).then(function(r){
      if(r.error){alert('Erreur de lecture : '+r.error.message);return;}
      LEADS=r.data||[];
      fillFilterOptions();
      render();
    });
  }

  function uniq(key){var s={};LEADS.forEach(function(l){if(l[key])s[l[key]]=1;});return Object.keys(s).sort();}
  function fillFilterOptions(){
    fillSel('fApport',uniq('apport'));
    fillSel('fRegion',uniq('region'));
    fillSel('fHorizon',uniq('horizon'));
  }
  function fillSel(id,vals){
    var sel=document.getElementById(id),cur=sel.value,first=sel.options[0];
    sel.innerHTML='';sel.appendChild(first);
    vals.forEach(function(v){var o=document.createElement('option');o.textContent=v;sel.appendChild(o);});
    sel.value=cur;
  }

  function filtered(){
    var q=document.getElementById('search').value.toLowerCase();
    var fs=document.getElementById('fStatut').value, fa=document.getElementById('fApport').value,
        fr=document.getElementById('fRegion').value, fh=document.getElementById('fHorizon').value;
    var rows=LEADS.filter(function(l){
      if(fs&&l.statut!==fs)return false;
      if(fa&&l.apport!==fa)return false;
      if(fr&&l.region!==fr)return false;
      if(fh&&l.horizon!==fh)return false;
      if(q){var blob=((l.prenom||'')+' '+(l.nom||'')+' '+(l.email||'')+' '+(l.tel||'')+' '+(l.message||'')).toLowerCase();if(blob.indexOf(q)===-1)return false;}
      return true;
    });
    rows.sort(function(a,b){
      var x=a[sortKey]||'',y=b[sortKey]||'';
      if(x<y)return sortAsc?-1:1; if(x>y)return sortAsc?1:-1; return 0;
    });
    return rows;
  }

  function fmtDate(s){ if(!s)return''; var d=new Date(s); return d.toLocaleDateString('fr-CH')+' '+d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}); }

  function render(){
    var rows=filtered();
    // stats
    var total=LEADS.length, comp=LEADS.filter(function(l){return l.statut==='Complété';}).length;
    document.getElementById('stats').innerHTML=
      stat(total,'Lignes totales')+stat(comp,'Assessments complétés')+stat(total-comp,'Inscrits (partiels)');
    // head
    var head='';COLS.forEach(function(c){var ar=(sortKey===c.k)?(sortAsc?' ▲':' ▼'):'';head+='<th onclick="setSort(\''+c.k+'\')">'+c.label+ar+'</th>';});
    document.getElementById('head').innerHTML=head;
    // body
    var body='';
    rows.forEach(function(l){
      body+='<tr>';
      COLS.forEach(function(c){
        var v=l[c.k]||'';
        if(c.k==='created_at')v=fmtDate(v);
        v=esc(v); // les champs viennent du formulaire public : jamais injectés tels quels
        if(c.k==='statut'){var cl=(l.statut==='Complété')?'c':'i';v='<span class="badge '+cl+'">'+v+'</span>';}
        body+='<td class="'+(c.k==='message'?'msg':'')+'">'+v+'</td>';
      });
      body+='</tr>';
    });
    document.getElementById('body').innerHTML=body;
    document.getElementById('empty').style.display=rows.length?'none':'block';
    document.getElementById('count').textContent=rows.length+' ligne(s) affichée(s)';
  }
  function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function stat(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>';}
  function setSort(k){ if(sortKey===k)sortAsc=!sortAsc; else{sortKey=k;sortAsc=true;} render(); }

  function exportCSV(){
    var rows=filtered();
    var head=COLS.map(function(c){return c.label;}).join(';');
    var lines=rows.map(function(l){
      return COLS.map(function(c){
        var v=(c.k==='created_at')?fmtDate(l[c.k]):(l[c.k]||'');
        v=String(v); if(/^([=@\t\r]|[+\-][^\d\s])/.test(v))v="'"+v; // bloque les formules Excel
        v=v.replace(/"/g,'""');
        return '"'+v+'"';
      }).join(';');
    });
    var csv='\ufeff'+head+'\n'+lines.join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='novad-leads-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  }

  document.getElementById('pass').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
</script>
</body>
</html>
